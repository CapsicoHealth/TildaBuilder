<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub OAuth Login</title>
  <script>
    async function handleGitHubCallback() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      if (!code) {
        return;
      }

      try {
        const response = await fetch('https://github.com/login/oauth/access_token', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            client_id: 'Ov23li80lok0Vo3mPB1c',
            client_secret: 'ae0742b153d94ea310e27a8885a8706e3d055881',
            code: code
          })
        });

        const data = await response.json();
        const accessToken = data.access_token;

        if (accessToken) {
          localStorage.setItem('github_access_token', accessToken);
          window.location.href = 'repos.html';
          alert(accessToken);
        } else {
          document.body.innerHTML = '<p>Error: Unable to retrieve access token</p>';
        }
      } catch (error) {
        document.body.innerHTML = `<p>Error: ${error.message}</p>`;
      }
    }

    window.onload = handleGitHubCallback;
    
  </script>
</head>
<body>
  <h1>Welcome to My App</h1>
  <a href="https://github.com/login/oauth/authorize?client_id=Ov23li80lok0Vo3mPB1c&scope=repo">
    <button>Login with GitHub</button>
  </a>
</body>
</html>
